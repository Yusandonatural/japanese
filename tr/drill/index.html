<body>
<main class="wrap">
  <div class="muted small" id="crumb"></div>
  <h1 id="title" data-i18n>Alıştırma</h1>
  <div class="row" style="justify-content:space-between">
    <div class="small muted" id="counter"></div>
    <div class="progress-bar" style="flex:1;margin:0 12px"><i id="bar" style="width:0%"></i></div>
    <div class="small muted" id="score">0 / 0</div>
  </div>

  <div class="panel flash-intro" id="flashIntro" hidden><b data-i18n>⚡ Anında konuşma</b> <span class="small muted" data-i18n>Anlamı gör, çubuk bitmeden Japoncasını yüksek sesle söyle, sonra kendini kontrol et. Hız akıcılık kazandırır.</span></div>
  <div class="panel" id="qbox"></div>
  <div class="row" style="justify-content:space-between">
    <div class="status" id="status"></div>
    <div class="row">
      <button class="btn ghost" id="skipBtn" data-i18n>Geç</button>
      <button class="btn" id="checkBtn" data-i18n>Kontrol et</button>
      <button class="btn" id="nextBtn" style="display:none" data-i18n>Sonraki →</button>
    </div>
  </div>

  <div class="panel" id="doneBox" style="display:none">
    <h2 data-i18n>Harika iş 🎉</h2>
    <p id="doneSummary"></p>
    <div id="weakList"></div>
    <div class="row" style="margin-top:10px">
      <a class="btn" id="nextLesson" href="../lesson/" style="display:none" data-i18n>Sonraki ders →</a>
      <a class="btn ghost" id="toChapter" href="#" data-i18n>Bölüme dön</a>
      <a class="btn ghost" href="../" data-i18n>Ana sayfa</a>
    </div>
  </div>
</main>

<script type="module">
import { renderHeader, renderFooter, loadChapter, loadParticles, loadLessons, qs, chapterFor, shuffle, t } from '../../js/app.js';
import { scopedExamples, lessonExamples } from '../../js/scope.js';
import { renderQuestion, pickType } from '../../js/quiz.js';
import { renderFlash } from '../../js/flash.js';
import { recordAnswer, recordParticle, markDayDone, particleStats } from '../../js/srs.js';
import { speak } from '../../js/speech.js';
renderHeader('');

const ch = Math.max(1, Math.min(10, parseInt(qs('ch') || '1', 10)));
const day = qs('day');
const FLASH = qs('mode') === 'flash';
const N = parseInt(qs('n') || (FLASH ? '20' : '30'), 10);
const chapter = chapterFor(ch);
document.getElementById('crumb').innerHTML = `<a href="../">${t('Home')}</a> / <a href="../ch/?n=${ch}">${t('Chapter {n}', { n: ch })}</a> / ${t('Drill')}`;
document.getElementById('title').textContent = FLASH ? t('Instant speaking · Chapter {n}. {title}', { n: ch, title: chapter.title }) : t('Drill · Chapter {n}. {title}', { n: ch, title: chapter.title });
if (FLASH) document.getElementById('flashIntro').hidden = false;
document.getElementById('toChapter').href = `../ch/?n=${ch}`;

const [examples, particles, lessons] = await Promise.all([loadChapter(ch), loadParticles(), loadLessons()]);
// only what this chapter (up to this day) has taught
const pool = scopedExamples(examples, ch, day);
const tagsTaught = pool.flatMap(e => e.chunks.map(c => c.p)).filter(Boolean);
const availableParticles = particles.filter(p => (p.chapter <= ch || ch >= 7) && (tagsTaught.includes(p.p) || p.chapter < ch)).map(p => p.p);
const opts = { particles, availableParticles, speak, pool };
let deck;
if (FLASH) {
  // instant speaking: half from the lesson itself, half from the chapter's sentences
  const fromLesson = shuffle(lessonExamples(lessons, ch, day)).slice(0, Math.ceil(N / 2));
  deck = shuffle([...fromLesson, ...shuffle(pool).slice(0, N - fromLesson.length)]);
} else {
  deck = shuffle(pool).slice(0, Math.min(N, pool.length));
}

let idx = 0, correct = 0, answered = 0;
let current = null;
const qbox = document.getElementById('qbox');
const statusEl = document.getElementById('status');
const checkBtn = document.getElementById('checkBtn');
const nextBtn = document.getElementById('nextBtn');
const skipBtn = document.getElementById('skipBtn');

function updateBar() {
  document.getElementById('counter').textContent = t('Question {n} / {total}', { n: idx + 1, total: deck.length });
  document.getElementById('bar').style.width = Math.round((idx / deck.length) * 100) + '%';
  document.getElementById('score').textContent = `${correct} / ${answered}`;
}

function showQuestion() {
  if (idx >= deck.length) return finish();
  const ex = deck[idx];
  current?.destroy?.();
  // instant speaking: every card in flash mode, and about one card in six in a normal drill
  const type = (FLASH || Math.random() < 0.16) ? 'flash' : pickType(ex);
  if (type === 'flash') {
    qbox.innerHTML = '';
    const label = document.createElement('div'); label.className = 'small muted'; label.textContent = '⚡ ' + t('Instant speaking');
    qbox.appendChild(label);
    current = renderFlash(qbox, ex, { ...opts, onGraded: ok => grade({ ok }) });
  } else {
    current = renderQuestion(qbox, ex, type, opts);
  }
  current.ex = ex; current.type = type;
  statusEl.textContent = ''; statusEl.className = 'status';
  checkBtn.style.display = current.selfGraded ? 'none' : ''; nextBtn.style.display = 'none';
  updateBar();
}

checkBtn.addEventListener('click', () => grade(current.check()));
function grade(result) {
  answered++;
  const particleTagged = current.ex.chunks.find(c => c.p)?.p || '';
  if (result.ok) {
    correct++;
    statusEl.textContent = t('✓ That works.');
    statusEl.className = 'status ok';
  } else {
    statusEl.textContent = current.correctText ? t('Not quite. → {x}', { x: current.correctText }) : t('✗ Not quite — try to notice the difference and move on.');
    statusEl.className = 'status ng';
  }
  recordAnswer(current.ex.id, !!result.ok);
  if (particleTagged) recordParticle(particleTagged, !!result.ok);
  checkBtn.style.display = 'none'; nextBtn.style.display = '';
  updateBar();
  if (FLASH) setTimeout(() => { if (current && current.ex === deck[idx]) { idx++; showQuestion(); } }, 900);
}
nextBtn.addEventListener('click', () => { idx++; showQuestion(); });
skipBtn.addEventListener('click', () => { idx++; showQuestion(); });

function finish() {
  current?.destroy?.();
  qbox.style.display = 'none';
  document.querySelector('.row.status')?.remove?.();
  checkBtn.style.display = 'none'; nextBtn.style.display = 'none'; skipBtn.style.display = 'none';
  statusEl.textContent = '';
  document.getElementById('doneBox').style.display = '';
  document.getElementById('doneSummary').textContent = t('You got {c} of {a} right.', { c: correct, a: answered });
  const stats = particleStats();
  const weak = Object.entries(stats).filter(([, s]) => s.right + s.wrong >= 2).map(([p, s]) => [p, s.right / (s.right + s.wrong)]).sort((a, b) => a[1] - b[1]).slice(0, 3);
  const wl = document.getElementById('weakList');
  if (weak.length) {
    wl.innerHTML = `<p class="small muted">${t('Keep an eye on:')}</p>` + weak.map(([p, acc]) => `<span class="tag-pill" style="background:var(--p-${p === '(none)' ? 'none' : p})">${p === '(none)' ? t('no tag') : p} ${Math.round(acc * 100)}%</span>`).join(' ');
  }
  if (day) markDayDone(day);
  if (day && Number(day) < 14) { const nl = document.getElementById('nextLesson'); nl.href = `../lesson/?day=${Number(day) + 1}`; nl.textContent = t('Day {n} lesson →', { n: Number(day) + 1 }); nl.style.display = ''; }
  updateBar();
}

showQuestion();
renderFooter();
</script>
