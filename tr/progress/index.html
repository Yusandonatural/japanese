<body>
<main class="wrap">
  <div class="muted small"><a href="../" data-i18n>Ana sayfa</a> / <span data-i18n>İlerleme</span></div>
  <h1 data-i18n>İlerlemen</h1>

  <div class="panel gamebar">
    <div class="gstat streak"><span class="gi">🔥</span><b id="gStreak">0</b><span class="small muted" data-i18n>günlük seri</span></div>
    <div class="gstat best"><span class="gi">🏅</span><b id="gBest">0</b><span class="small muted" data-i18n>en iyi seri</span></div>
    <div class="gstat xp"><span class="gi">⚡</span><b id="gXP">0</b><span class="small muted" data-i18n>toplam XP</span></div>
  </div>

  <h2 data-i18n>Bu hafta</h2>
  <div class="panel"><div class="week" id="week"></div></div>

  <h2 data-i18n>Ayarlar</h2>
  <div class="panel">
    <div class="row"><b data-i18n>Günlük hedef</b> <div class="choices" id="goals" style="margin:0"></div></div>
    <label class="row small" style="margin-top:10px"><input type="checkbox" id="soundOn"> <span data-i18n>Ses efektleri</span></label>
  </div>

  <h2 data-i18n>14 günlük plan</h2>
  <div class="day-grid" id="days"></div>

  <h2 data-i18n>Bölüm sınavları</h2>
  <div id="tests" class="panel"></div>

  <h2 data-i18n>Etiket doğruluğu</h2>
  <p class="small muted" data-i18n>Bu tarayıcıdaki alıştırma ve sınav cevaplarına göre.</p>
  <div id="particleAcc" class="panel"></div>

  <div class="row">
    <button class="btn ghost" id="resetBtn" data-i18n>Tüm ilerlemeyi sıfırla</button>
  </div>
</main>

<script type="module">
import { renderHeader, renderFooter, loadParticles, CHAPTERS, pColor, t } from '../../js/app.js';
import { loadDayLog, loadTests, particleStats } from '../../js/srs.js';
import { getGame, lastDays, setGoal, setSound, resetGame, GOALS } from '../../js/game.js';
renderHeader('progress');

const game = getGame();
document.getElementById('gStreak').textContent = game.streak;
document.getElementById('gBest').textContent = game.best || 0;
document.getElementById('gXP').textContent = game.xp;
const days = lastDays(7);
const maxXP = Math.max(game.goal, ...days.map(d => d.xp));
const locale = document.documentElement.lang || 'en';
document.getElementById('week').innerHTML = days.map(d => `<div class="wk${d.xp >= game.goal ? ' hit' : ''}"><small>${d.xp}</small><i style="height:${Math.round((d.xp / maxXP) * 100)}%"></i><span>${new Date(d.date + 'T12:00:00').toLocaleDateString(locale, { weekday: 'short' })}</span></div>`).join('');
const goals = document.getElementById('goals');
GOALS.forEach(g => {
  const b = document.createElement('button'); b.className = 'choice' + (g === game.goal ? ' ok' : ''); b.textContent = `${g} XP`;
  b.addEventListener('click', () => { setGoal(g); location.reload(); });
  goals.appendChild(b);
});
const snd = document.getElementById('soundOn'); snd.checked = game.sound !== false;
snd.addEventListener('change', () => setSound(snd.checked));

const log = loadDayLog();
const daysWrap = document.getElementById('days');
for (let d = 1; d <= 14; d++) {
  const ch = CHAPTERS.find(c => c.days.includes(d));
  const el = document.createElement('a');
  el.href = `../ch/?n=${ch.n}&day=${d}`;
  el.className = 'day' + (log[d] ? ' done' : '');
  el.innerHTML = `${t('Day {n}', { n: d })}<br>${log[d] ? '✓' : t('Ch{n}', { n: ch.n })}`;
  daysWrap.appendChild(el);
}

const tests = loadTests();
const testsWrap = document.getElementById('tests');
if (!Object.keys(tests).length) testsWrap.innerHTML = `<p class="muted small">${t('No chapter tests taken yet.')}</p>`;
CHAPTERS.forEach(c => {
  const tr = tests[c.n];
  const row = document.createElement('div'); row.className = 'row'; row.style.padding = '6px 0';
  const pct = tr ? Math.round((tr.correct / tr.total) * 100) : null;
  row.innerHTML = `<b style="min-width:90px">${t('Chapter {n}', { n: c.n })}</b>` + (tr ? `<span class="${pct >= 80 ? 'status ok' : 'status ng'}" style="min-height:auto">${tr.correct}/${tr.total} (${pct}%)</span>` : `<span class="muted small">${t('not taken')}</span>`);
  testsWrap.appendChild(row);
});

const particles = await loadParticles();
const stats = particleStats();
const accWrap = document.getElementById('particleAcc');
const rows = particles.map(p => [p, stats[p.p]]).filter(([, s]) => s && (s.right + s.wrong) > 0);
if (!rows.length) accWrap.innerHTML = `<p class="muted small">${t('Do a drill or two, and this fills in.')}</p>`;
rows.sort((a, b) => (a[1].right / (a[1].right + a[1].wrong)) - (b[1].right / (b[1].right + b[1].wrong)));
rows.forEach(([p, s]) => {
  const acc = s.right / (s.right + s.wrong);
  const row = document.createElement('div'); row.className = 'row'; row.style.padding = '6px 0';
  row.innerHTML = `<span class="tag-pill" style="background:${pColor(p.p)};min-width:26px;text-align:center">${p.p}</span>
    <div style="flex:1"><div class="progress-bar"><i style="width:${Math.round(acc*100)}%;background:${acc >= .8 ? 'var(--ok)' : acc >= .5 ? 'var(--accent)' : 'var(--ng)'}"></i></div></div>
    <span class="small muted" style="min-width:70px;text-align:right">${s.right}/${s.right + s.wrong} (${Math.round(acc*100)}%)</span>`;
  accWrap.appendChild(row);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm(t('Reset all progress on this device? This cannot be undone.'))) return;
  ['tags.srs.v1', 'tags.particleStats.v1', 'tags.dayLog.v1', 'tags.chapterTests.v1'].forEach(k => localStorage.removeItem(k));
  resetGame();
  location.reload();
});

renderFooter();
</script>
