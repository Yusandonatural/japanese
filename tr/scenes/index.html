<body>
<main class="wrap">
  <div class="muted small" id="crumb"><a href="../" data-i18n>Ana sayfa</a> / <span data-i18n>Sahneler</span></div>
  <h1 id="title" data-i18n>Sahnelere göre göz at</h1>
  <p class="lead" id="sub" data-i18n>2.000 cümlenin her biri gerçek hayattan bir sahneye ait. Cümleleri bağlamı içinde görmek için bir sahne seç.</p>

  <div id="sceneGrid" class="grid"></div>
  <div id="list"></div>
</main>

<script type="module">
import { renderHeader, renderFooter, loadAll, loadParticles, loadScenes, sentenceView, qs, t } from '../../js/app.js';
renderHeader('');

const scene = qs('scene');
const [examples, particles, scenes] = await Promise.all([loadAll(), loadParticles(), loadScenes()]);

if (!scene) {
  const grid = document.getElementById('sceneGrid');
  scenes.forEach(s => {
    const count = examples.filter(e => e.scene === s.id).length;
    const a = document.createElement('a'); a.className = 'chapter-card'; a.href = `?scene=${s.id}`;
    a.innerHTML = `<div class="n">${s.icon} ${t('{n} sentences', { n: count })}</div><div class="t">${s.name}</div><div class="small muted">${s.ja}</div>`;
    grid.appendChild(a);
  });
} else {
  const s = scenes.find(x => x.id === scene);
  document.getElementById('title').textContent = s ? `${s.icon} ${s.name}` : scene;
  document.getElementById('sub').textContent = s ? s.ja : '';
  document.getElementById('crumb').innerHTML = `<a href="../">${t('Home')}</a> / <a href="./">${t('Scenes')}</a> / ${s ? s.name : scene}`;
  document.getElementById('sceneGrid').remove();
  const items = examples.filter(e => e.scene === scene).sort((a, b) => a.chapter - b.chapter);
  const listEl = document.getElementById('list');
  items.forEach(ex => {
    const row = document.createElement('div'); row.className = 'list-ex';
    row.appendChild(sentenceView(ex, { particles }));
    const en = document.createElement('div'); en.className = 'en muted'; en.textContent = `${ex.en} · ${t('Ch{n}', { n: ex.chapter })}`; row.appendChild(en);
    listEl.appendChild(row);
  });
}

renderFooter();
</script>
</body>
