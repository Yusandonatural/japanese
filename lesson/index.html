<body>
<main class="wrap prose" id="main">
  <p class="muted" data-i18n>Loading…</p>
</main>

<script type="module">
import { renderHeader, renderFooter, loadLessons, loadParticles, exBlock, esc, qs, CHAPTERS, kanaToRomaji, t } from '../js/app.js';
import { isDayDone } from '../js/srs.js';
import { speak, canSpeak } from '../js/speech.js';
renderHeader('lessons');

const lessons = await loadLessons();
const particles = await loadParticles();
const main = document.getElementById('main');
const dayParam = parseInt(qs('day') || '0', 10);

// prose: escape, drop the ".tag" notation dots, colour tags that follow a kana word
const tagRe = /([ぁ-ゖァ-ヺー])\.(から|まで|でも|にも|とも|へも|は|が|を|に|で|と|へ|も)(?![ぁ-ゖ])/g;
function prose(t) {
  return esc(t).replace(tagRe, (m, a, p) => {
    const base = p.length > 1 && p.endsWith('も') ? p.slice(0, -1) : p;
    const col = (particles.find(x => x.p === base) || {}).color || 'inherit';
    return `${a}<b style="color:${col}">${p}</b>`;
  });
}

if (!dayParam || !lessons.find(l => l.day === dayParam)) renderIndex(); else renderLesson(dayParam);

function renderIndex() {
  document.title = `${t('Daily lessons')} — Easy Japanese 14 Days`;
  main.innerHTML = `<h1>${t('14 daily lessons')}</h1>
    <p class="lead">${t("Read the day's lesson (about 15 minutes), then do the drill. Each lesson explains one step of Tag Grammar with examples you can listen to.")}</p>
    <div class="panel lesson-list" id="list" style="padding-top:4px;padding-bottom:4px"></div>`;
  const list = document.getElementById('list');
  lessons.forEach(l => {
    const a = document.createElement('a'); a.href = `?day=${l.day}`;
    a.innerHTML = `<span class="d">${t('Day {n}', { n: l.day })}</span><span><b>${esc(l.title)}</b><br><span class="small muted">${esc(l.goal)}</span></span>${isDayDone(l.day) ? '<span class="done-mark">✓</span>' : ''}`;
    list.appendChild(a);
  });
}

function renderLesson(day) {
  const l = lessons.find(x => x.day === day);
  const ch = CHAPTERS.find(c => c.n === l.chapter);
  document.title = `${t('Day {n}', { n: day })}: ${l.title} — Easy Japanese 14 Days`;
  const prev = lessons.find(x => x.day === day - 1), next = lessons.find(x => x.day === day + 1);
  main.innerHTML = `
    <div class="muted small"><a href="../">${t('Home')}</a> / <a href="./">${t('Lessons')}</a> / ${t('Day {n}', { n: day })}</div>
    <div class="small muted" style="margin-top:10px">${t('Day {d} of 14 · Chapter {c}: {t} · about {m} min', { d: day, c: l.chapter, t: esc(ch ? ch.title : ''), m: l.minutes || 15 })}</div>
    <h1>${esc(l.title)}</h1>
    <div class="muted" style="font-size:18px">${esc(l.ja || '')}</div>
    <div class="panel goal">🎯 ${esc(l.goal)}</div>
    <p>${prose(l.intro)}</p>
    <div id="sections"></div>
    <h2>${t('Try it')}</h2>
    <p class="small muted">${t('Say it out loud first, then tap to check.')}</p>
    <div class="panel tryit" id="tryit"></div>
    <h2>${t('Key words')}</h2>
    <div class="wordgrid" id="words"></div>
    <h2>${t('Recap')}</h2>
    <div class="panel"><ul id="recap" style="margin:0;padding-left:20px"></ul></div>
    ${l.next ? `<p class="muted"><b>${t('Next:')}</b> ${prose(l.next)}</p>` : ''}
    <div class="panel row" style="justify-content:space-between">
      <div><b>${t('Now practise')}</b><div class="small muted">${t('A short drill on Chapter {c}. It marks Day {d} as done.', { c: l.chapter, d: day })}</div></div>
      <div class="row"><a class="btn ghost" href="../ch/?n=${l.chapter}&day=${day}">${t('Examples')}</a><a class="btn ghost" href="../drill/?ch=${l.chapter}&day=${day}&mode=flash">⚡ ${t('Instant speaking')}</a><a class="btn" href="../drill/?ch=${l.chapter}&day=${day}">${t('Start the drill →')}</a></div>
    </div>
    <div class="lesson-nav">
      ${prev ? `<a class="btn ghost small" href="?day=${prev.day}">${t('← Day {d}', { d: prev.day })}</a>` : '<span></span>'}
      <a class="btn ghost small" href="./">${t('All lessons')}</a>
      ${next ? `<a class="btn ghost small" href="?day=${next.day}">${t('Day {d} →', { d: next.day })}</a>` : '<span></span>'}
    </div>`;

  const secs = document.getElementById('sections');
  l.sections.forEach(s => {
    const box = document.createElement('section');
    box.innerHTML = `<h2>${prose(s.h)}</h2>` + (s.p || []).map(p => `<p>${prose(p)}</p>`).join('');
    (s.ex || []).forEach(e => box.appendChild(exBlock(e)));
    if (s.wrong && s.wrong.length) {
      const m = document.createElement('div'); m.className = 'panel'; m.innerHTML = `<div class="small"><b>${t('Watch out')}</b></div>`;
      s.wrong.forEach((w, i) => { m.appendChild(exBlock(w.includes('|') ? w : w + '|', { wrong: true })); if (s.right && s.right[i]) m.appendChild(exBlock(s.right[i], { right: true })); });
      box.appendChild(m);
    }
    if (s.tip) { const t = document.createElement('div'); t.className = 'tip'; t.innerHTML = prose(s.tip); box.appendChild(t); }
    secs.appendChild(box);
  });

  const tr = document.getElementById('tryit');
  (l.tryit || []).forEach((t, i) => {
    const d = document.createElement('details');
    d.innerHTML = `<summary>${i + 1}. ${prose(t.q)}</summary>`;
    d.appendChild(exBlock(t.a));
    tr.appendChild(d);
  });

  const wg = document.getElementById('words');
  (l.words || []).forEach(w => {
    const d = document.createElement('div'); d.className = 'w'; d.style.cursor = canSpeak() ? 'pointer' : 'default';
    d.innerHTML = `<b>${esc(w.k)}</b><span>${esc(kanaToRomaji(w.k))} · ${esc(w.en)}</span>`;
    if (canSpeak()) d.addEventListener('click', () => speak(w.k));
    wg.appendChild(d);
  });

  const rc = document.getElementById('recap');
  (l.recap || []).forEach(r => { const li = document.createElement('li'); li.innerHTML = prose(r); rc.appendChild(li); });
}

renderFooter();
</script>
