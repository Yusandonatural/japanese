<body>
<main class="wrap">
  <div class="row" style="justify-content:space-between">
    <div class="muted small" id="crumb"></div>
    <div class="row small">
      <button class="btn ghost small" id="prevCh">← Prev</button>
      <button class="btn ghost small" id="nextCh">Next →</button>
    </div>
  </div>
  <h1 id="title">Chapter</h1>
  <p class="lead" id="sub"></p>

  <div id="particlesRow" class="row"></div>

  <div class="panel row" style="justify-content:space-between">
    <div class="row small">
      <label class="toggle"><input type="checkbox" id="tglKana" checked> kana</label>
      <label class="toggle"><input type="checkbox" id="tglRomaji" checked> romaji</label>
      <label class="toggle"><input type="checkbox" id="tglKanji"> kanji</label>
      <label class="toggle"><input type="checkbox" id="tglGloss" checked> gloss</label>
    </div>
    <div class="row">
      <a class="btn" id="drillLink" href="#">Start drill →</a>
      <a class="btn ghost" id="testLink" href="#">Chapter test</a>
    </div>
  </div>

  <h2>Examples (<span id="count"></span>)</h2>
  <div class="tabs" id="sceneTabs"></div>
  <div id="list"></div>
</main>

<script type="module">
import { renderHeader, renderFooter, loadChapter, loadParticles, loadScenes, sentenceView, qs, chapterFor, CHAPTERS, getSettings, setSettings } from '../js/app.js';
renderHeader('');

const n = Math.max(1, Math.min(10, parseInt(qs('n') || '1', 10)));
const day = qs('day');
const chapter = chapterFor(n);
document.title = `Ch${n} ${chapter.title} — にほんご Tags`;
document.getElementById('crumb').innerHTML = `<a href="../">Home</a> / Chapter ${n}`;
document.getElementById('title').textContent = `Chapter ${n}. ${chapter.title}`;
document.getElementById('sub').textContent = chapter.sub;
document.getElementById('drillLink').href = `../drill/?ch=${n}${day ? '&day=' + day : ''}`;
document.getElementById('testLink').href = `../test/?ch=${n}`;
document.getElementById('prevCh').disabled = n <= 1;
document.getElementById('nextCh').disabled = n >= 10;
document.getElementById('prevCh').onclick = () => location.href = `?n=${n - 1}`;
document.getElementById('nextCh').onclick = () => location.href = `?n=${n + 1}`;

const [examples, particles, scenes] = await Promise.all([loadChapter(n), loadParticles(), loadScenes()]);
const pRow = document.getElementById('particlesRow');
particles.filter(p => p.chapter <= n).forEach(p => {
  const pill = document.createElement('span'); pill.className = 'tag-pill'; pill.style.background = p.color; pill.textContent = `${p.p} ${p.label}`;
  pRow.appendChild(pill);
});
if (n >= 7) { const pill = document.createElement('span'); pill.className = 'small muted'; pill.textContent = '(all 10 tags)'; pRow.appendChild(pill); }

document.getElementById('count').textContent = examples.length;

const s = getSettings();
document.getElementById('tglRomaji').checked = s.romaji !== false;
document.getElementById('tglKanji').checked = !!s.kanji;
['tglRomaji', 'tglKanji'].forEach(id => document.getElementById(id).addEventListener('change', e => {
  setSettings({ [id === 'tglRomaji' ? 'romaji' : 'kanji']: e.target.checked });
  renderList(currentScene);
}));

const sceneIds = [...new Set(examples.map(e => e.scene))];
const sceneTabs = document.getElementById('sceneTabs');
let currentScene = 'all';
function makeTab(id, label) {
  const b = document.createElement('button'); b.textContent = label; b.className = id === currentScene ? 'on' : '';
  b.addEventListener('click', () => { currentScene = id; [...sceneTabs.children].forEach(c => c.classList.toggle('on', c === b)); renderList(id); });
  sceneTabs.appendChild(b);
}
makeTab('all', `All (${examples.length})`);
sceneIds.forEach(id => { const sc = scenes.find(s => s.id === id); const count = examples.filter(e => e.scene === id).length; makeTab(id, `${sc ? sc.icon + ' ' + sc.name : id} (${count})`); });

const listEl = document.getElementById('list');
function renderList(scene) {
  listEl.innerHTML = '';
  const items = scene === 'all' ? examples : examples.filter(e => e.scene === scene);
  items.slice(0, 60).forEach(ex => {
    const row = document.createElement('div'); row.className = 'list-ex';
    row.appendChild(sentenceView(ex, { particles, gloss: document.getElementById('tglGloss').checked }));
    const en = document.createElement('div'); en.className = 'en muted'; en.textContent = ex.en; row.appendChild(en);
    listEl.appendChild(row);
  });
  if (items.length > 60) { const more = document.createElement('p'); more.className = 'muted small'; more.textContent = `+ ${items.length - 60} more — head to the drill to see them all.`; listEl.appendChild(more); }
}
document.getElementById('tglGloss').addEventListener('change', () => renderList(currentScene));
renderList('all');

renderFooter();
</script>
</body>
