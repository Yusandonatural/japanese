<body>
<main class="wrap">
  <div class="muted small" id="crumb"></div>
  <h1 id="title">Drill</h1>
  <div class="row" style="justify-content:space-between">
    <div class="small muted" id="counter"></div>
    <div class="progress-bar" style="flex:1;margin:0 12px"><i id="bar" style="width:0%"></i></div>
    <div class="small muted" id="score">0 / 0</div>
  </div>

  <div class="panel" id="qbox"></div>
  <div class="row" style="justify-content:space-between">
    <div class="status" id="status"></div>
    <div class="row">
      <button class="btn ghost" id="skipBtn">Skip</button>
      <button class="btn" id="checkBtn">Check</button>
      <button class="btn" id="nextBtn" style="display:none">Next →</button>
    </div>
  </div>

  <div class="panel" id="doneBox" style="display:none">
    <h2>Nice work 🎉</h2>
    <p id="doneSummary"></p>
    <div id="weakList"></div>
    <div class="row" style="margin-top:10px">
      <a class="btn" id="nextLesson" href="../lesson/" style="display:none">Next lesson →</a>
      <a class="btn ghost" id="toChapter" href="#">Back to chapter</a>
      <a class="btn ghost" href="../">Home</a>
    </div>
  </div>
</main>

<script type="module">
import { renderHeader, renderFooter, loadChapter, loadParticles, qs, chapterFor, shuffle } from '../js/app.js';
import { renderQuestion, pickType } from '../js/quiz.js';
import { recordAnswer, recordParticle, markDayDone, particleStats } from '../js/srs.js';
import { speak } from '../js/speech.js';
renderHeader('');

const ch = Math.max(1, Math.min(10, parseInt(qs('ch') || '1', 10)));
const day = qs('day');
const N = parseInt(qs('n') || '30', 10);
const chapter = chapterFor(ch);
document.getElementById('crumb').innerHTML = `<a href="../">Home</a> / <a href="../ch/?n=${ch}">Chapter ${ch}</a> / Drill`;
document.getElementById('title').textContent = `Drill · Chapter ${ch}. ${chapter.title}`;
document.getElementById('toChapter').href = `../ch/?n=${ch}`;

const [examples, particles] = await Promise.all([loadChapter(ch), loadParticles()]);
const availableParticles = particles.filter(p => p.chapter <= ch || ch >= 7).map(p => p.p);
const opts = { particles, availableParticles, speak };
const deck = shuffle(examples).slice(0, Math.min(N, examples.length));

let idx = 0, correct = 0, answered = 0;
let current = null;
const qbox = document.getElementById('qbox');
const statusEl = document.getElementById('status');
const checkBtn = document.getElementById('checkBtn');
const nextBtn = document.getElementById('nextBtn');
const skipBtn = document.getElementById('skipBtn');

function updateBar() {
  document.getElementById('counter').textContent = `Question ${idx + 1} / ${deck.length}`;
  document.getElementById('bar').style.width = Math.round((idx / deck.length) * 100) + '%';
  document.getElementById('score').textContent = `${correct} / ${answered}`;
}

function showQuestion() {
  if (idx >= deck.length) return finish();
  const ex = deck[idx];
  const type = pickType(ex);
  current = renderQuestion(qbox, ex, type, opts);
  current.ex = ex; current.type = type;
  statusEl.textContent = ''; statusEl.className = 'status';
  checkBtn.style.display = ''; nextBtn.style.display = 'none';
  updateBar();
}

checkBtn.addEventListener('click', () => {
  const result = current.check();
  answered++;
  const particleTagged = current.ex.chunks.find(c => c.p)?.p || '';
  if (result.ok) {
    correct++;
    statusEl.textContent = '✓ That works.';
    statusEl.className = 'status ok';
  } else {
    statusEl.textContent = current.correctText ? `Not quite. → ${current.correctText}` : '✗ Not quite — try to notice the difference and move on.';
    statusEl.className = 'status ng';
  }
  recordAnswer(current.ex.id, !!result.ok);
  if (particleTagged) recordParticle(particleTagged, !!result.ok);
  checkBtn.style.display = 'none'; nextBtn.style.display = '';
  updateBar();
});
nextBtn.addEventListener('click', () => { idx++; showQuestion(); });
skipBtn.addEventListener('click', () => { idx++; showQuestion(); });

function finish() {
  qbox.style.display = 'none';
  document.querySelector('.row.status')?.remove?.();
  checkBtn.style.display = 'none'; nextBtn.style.display = 'none'; skipBtn.style.display = 'none';
  statusEl.textContent = '';
  document.getElementById('doneBox').style.display = '';
  document.getElementById('doneSummary').textContent = `You got ${correct} of ${answered} right.`;
  const stats = particleStats();
  const weak = Object.entries(stats).filter(([, s]) => s.right + s.wrong >= 2).map(([p, s]) => [p, s.right / (s.right + s.wrong)]).sort((a, b) => a[1] - b[1]).slice(0, 3);
  const wl = document.getElementById('weakList');
  if (weak.length) {
    wl.innerHTML = '<p class="small muted">Keep an eye on:</p>' + weak.map(([p, acc]) => `<span class="tag-pill" style="background:var(--p-${p === '(none)' ? 'none' : p})">${p === '(none)' ? 'no tag' : p} ${Math.round(acc * 100)}%</span>`).join(' ');
  }
  if (day) markDayDone(day);
  if (day && Number(day) < 14) { const nl = document.getElementById('nextLesson'); nl.href = `../lesson/?day=${Number(day) + 1}`; nl.textContent = `Day ${Number(day) + 1} lesson →`; nl.style.display = ''; }
  updateBar();
}

showQuestion();
renderFooter();
</script>
